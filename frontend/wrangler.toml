# SPVH Options Desk -- team site on Cloudflare (Worker + static assets + relay).
# Deploy:  npm run build && npx wrangler deploy
# Secret:  npx wrangler secret put RELAY_SECRET   (same value as "desk_relay_secret" in ../config.json)
name = "spvh-desk"
main = "worker/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/relay"]

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]
