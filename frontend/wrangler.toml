# SPVH Options Desk -- team site on Cloudflare (Worker + static assets + relay).
# Deploy:  npm run build && npx wrangler deploy
# Secret:  npx wrangler secret put RELAY_SECRET   (same value as "desk_relay_secret" in ../config.json)
name = "spvh-desk"
main = "worker/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/relay", "/sync/*"]

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

# Cloud NIFTY collector staging store (rows are deleted once the backend has synced them)
[[d1_databases]]
binding = "DB"
database_name = "spvh-nifty"
database_id = "51a2b286-c5c8-486d-97f4-cf5507170921"

# Every minute 08:30-16:29 IST on weekdays; the collector itself keeps to 09:15-15:30
[triggers]
crons = ["* 3-10 * * MON-FRI"]
